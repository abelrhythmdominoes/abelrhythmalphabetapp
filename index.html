              <div ref={beatsContainerRef} className="flex flex-wrap gap-2 items-center">
                {Array.from({ length: beatsPerBar }).map((_, i) => (
                  <div key={i} data-beat className="abel-beat" />
                ))}
              </div>
            </div>

            {/* A/V sync fine-tuning (hidden by default) */}
            <button
              onClick={() => setShowSync((v) => !v)}
              className="text-xs text-gray-400 hover:text-gray-200 underline"
            >
              {showSync ? 'Hide' : 'Show'} animation delay
            </button>
            {showSync && (
              <>
                <div className="flex items-center gap-4">
                  <label className="text-sm whitespace-nowrap">Animation delay: {syncOffset} ms</label>
                  <input
                    type="range"
                    min="0"
                    max="400"
                    step="5"
                    value={syncOffset}
                    onChange={(e) => setSyncOffset(Number(e.target.value))}
                    className="flex-1"
                  />
                </div>
                <div className="text-xs text-gray-500 -mt-1">
                  Keep at 0 for speakers. Increase it if the animation appears before you hear the sound (e.g. Bluetooth headphones).
                </div>
              </>
            )}

            {/* Instrument Selector (hidden in Layer Mode: each layer has its own) */}
            {!isLayerMode && (
              <div className="border-t border-gray-700 pt-3 flex items-center gap-3">
                <label htmlFor="instrument" className="text-sm font-bold whitespace-nowrap">
                  Instrument:
                </label>
                <select
                  id="instrument"
                  value={selectedInstrument}
                  onChange={(e) => setSelectedInstrument(e.target.value)}
                  className="flex-1 bg-gray-700 border border-gray-600 rounded px-2 py-1.5 text-sm"
                >
                  {Object.entries(INSTRUMENTS).map(([key, inst]) => (
                    <option key={key} value={key}>
                      {inst.name}
                    </option>
                  ))}
                </select>
              </div>
            )}

            <div className="border-t border-gray-700 pt-3 space-y-2">
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="metronome"
                  checked={metronomeEnabled}
                  onChange={(e) => setMetronomeEnabled(e.target.checked)}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="metronome" className="text-sm cursor-pointer">
                  Metronome (click on beats)
                </label>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="ghostnotes"
                  checked={ghostNotesEnabled}
                  onChange={(e) => setGhostNotesEnabled(e.target.checked)}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="ghostnotes" className="text-sm cursor-pointer">
                  Ghost Notes (play dashes at low volume)
                </label>
              </div>
              <div className="flex items-center gap-3">
                <button
                  role="switch"
                  aria-checked={hapticsEnabled && hapticsSupported}
                  aria-label="Haptic feedback"
                  onClick={toggleHaptics}
                  disabled={!hapticsSupported}
                  className={`relative w-11 h-6 rounded-full transition-colors flex-shrink-0 ${
                    hapticsEnabled && hapticsSupported ? 'bg-green-500' : 'bg-gray-600'
                  } ${hapticsSupported ? '' : 'opacity-40 cursor-not-allowed'}`}
                >
                  <span
                    className={`absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full transition-transform ${
                      hapticsEnabled && hapticsSupported ? 'translate-x-5' : ''
                    }`}
                  />
                </button>
                <span className="text-sm">
                  Haptic feedback (vibrate on beats and notes)
                  {!hapticsSupported && (
                    <span className="block text-xs text-gray-500">Not supported on this device or browser</span>
                  )}
                </span>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="sequencemode"
                  checked={isSequenceMode}
                  onChange={toggleSequenceMode}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="sequencemode" className="text-sm cursor-pointer font-bold">
                  Sequence Mode
                </label>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="fusionmode"
                  checked={isFusionMode}
                  onChange={toggleFusionMode}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="fusionmode" className="text-sm cursor-pointer font-bold">
                  Fusion Mode
                </label>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="layermode"
                  checked={isLayerMode}
                  onChange={toggleLayerMode}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="layermode" className="text-sm cursor-pointer font-bold">
                  Layer Mode
                </label>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="notationmode"
                  checked={notationMode}
                  onChange={(e) => setNotationMode(e.target.checked)}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="notationmode" className="text-sm cursor-pointer font-bold">
                  Music Notation View
                </label>
              </div>
              {notationMode && (
                <div className="ml-6 space-y-2">
                  <div className="flex items-center gap-2 text-sm flex-wrap">
                    <span className="text-gray-400">Dashes shown as:</span>
                    <div className="flex rounded overflow-hidden border border-gray-600">
                      <button
                        onClick={() => setNotationGhost(false)}
                        className={`px-3 py-1 ${!notationGhost ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'}`}
                      >
                        Rests
                      </button>
                      <button
                        onClick={() => setNotationGhost(true)}
                        className={`px-3 py-1 ${notationGhost ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'}`}
                      >
                        Ghost notes
                      </button>
                    </div>
                  </div>
                  <div className="text-xs text-gray-500">
                    One pattern = one beat = one quarter note. A = quarter note, B = two eighth notes, E = eighth-note triplet, L = four sixteenth notes. Any other number of subdivisions gets a bracket with its number (5, 6, 7...).
                  </div>
                </div>
              )}
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="piemode"
                  checked={pieMode}
                  onChange={(e) => setPieMode(e.target.checked)}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="piemode" className="text-sm cursor-pointer font-bold">
                  Clock View
                </label>
              </div>
              {pieMode && (
                <div className="ml-6 text-xs text-gray-500">
                  Each pattern is a circle: one beat = one full turn, clockwise from 12 o'clock. A filled slice is a note, an empty slice is a rest. A white hand sweeps around the circle as the beat plays.
                </div>
              )}
              
            </div>
          </div>

          {/* Layer Builder */}
          {isLayerMode && (
            <div className="bg-emerald-900/30 border-2 border-emerald-500 rounded-lg p-4 mt-4">
              <div className="flex items-center justify-between mb-2 gap-2 flex-wrap">
                <h3 className="text-lg font-bold">Layer Mode</h3>
                <div className="flex gap-2">
                  <button
                    onClick={playLayers}
                    disabled={!hasLayers}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                      !hasLayers
                        ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                        : 'bg-emerald-600 hover:bg-emerald-700'
                    }`}
                  >
                    {playKind === 'layers' ? <Pause size={16} /> : <Play size={16} />}
                    {playKind === 'layers' ? 'Stop' : 'Play'} Layers
                  </button>
                  <button
                    onClick={clearAllLayers}
                    disabled={!hasLayers}
                    className={`px-4 py-2 rounded-lg transition-colors ${
                      !hasLayers
                        ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                        : 'bg-red-600 hover:bg-red-700'
                    }`}
                  >
                    Clear
                  </button>
                </div>
              </div>
              <div className="text-xs text-gray-400 mb-3">
                Tap a slot, then tap a pattern below (or your fused pattern) to place it. Each slot plays with its own instrument, all at the same time.
              </div>
              {fusedPattern && (
                <button
                  onClick={() => assignToLayer(fusedPattern)}
                  className="w-full text-left rounded-lg p-2 mb-3 border-2 border-blue-400 bg-gray-800 hover:bg-gray-700 transition-colors"
                >
                  <div className="text-xs text-blue-300 mb-1">
                    Your fused pattern: tap to place it in the selected slot
                  </div>
                  <div className="flex items-center gap-2">
                    <span
                      className="text-xs font-bold text-blue-400 flex-shrink-0 truncate"
                      style={{ minWidth: 24, maxWidth: 56 }}
                    >
                      {fusedPattern.letter}
                    </span>
                    <div className="flex-1 min-w-0">
                      <PatternView
                        viewId="layer-fused-tray"
                        pattern={fusedPattern}
                        registry={registryRef}
                        size="sm"
                        bar={false}
                      />
                    </div>
                  </div>
                </button>
              )}

              <div className="space-y-2">
                {layers.map((layer, i) => (
                  <div
                    key={i}
                    data-tile
                    onClick={() => setActiveLayer(i)}
                    className={`abel-tile flex items-center gap-2 rounded-lg p-2 border-2 cursor-pointer ${
                      activeLayer === i ? 'border-emerald-400 bg-gray-700' : 'border-gray-600 bg-gray-800'
                    }`}
                  >
                    <div
                      className={`w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center flex-shrink-0 ${
                        activeLayer === i ? 'bg-emerald-500 text-gray-900' : 'bg-gray-600'
                      }`}
                    >
                      {i + 1}
                    </div>

                    <div className="flex-1 min-w-0">
                      {layer.pattern ? (
                        <div className="flex items-center gap-2">
                          <span
                            className="text-xs font-bold flex-shrink-0 truncate"
                            style={{ color: accentFor(layer.pattern.color), minWidth: 24, maxWidth: 56 }}
                          >
                            {layer.pattern.letter}
                          </span>
                          <div className="flex-1 min-w-0">
                            <PatternView
                              viewId={`layer:${i}`}
                              pattern={layer.pattern}
                              registry={registryRef}
                              size="md"
                            />
                          </div>
                        </div>
                      ) : (
                        <div className="text-xs text-gray-500 py-3">Empty: tap a pattern below</div>
                      )}
                    </div>

                    <select
                      value={layer.instrument}
                      onChange={(e) => setLayerInstrument(i, e.target.value)}
                      className="w-32 flex-shrink-0 bg-gray-700 border border-gray-600 rounded px-1 py-1.5 text-xs"
                      aria-label={`Instrument for layer ${i + 1}`}
                    >
                      {Object.entries(INSTRUMENTS).map(([key, inst]) => (
                        <option key={key} value={key}>
                          {inst.name}
                        </option>
                      ))}
                    </select>

                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        clearLayer(i);
                      }}
                      disabled={!layer.pattern}
                      className={`w-6 h-6 rounded-full text-xs font-bold flex-shrink-0 ${
                        layer.pattern ? 'bg-red-500 hover:bg-red-600' : 'bg-gray-700 text-gray-600'
                      }`}
                      aria-label={`Clear layer ${i + 1}`}
                    >
                      ×
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Sequence Builder */}
          {isSequenceMode && (
            <div className="bg-purple-900/30 border-2 border-purple-500 rounded-lg p-4 mt-4">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <h3 className="text-lg font-bold flex items-center gap-2">
                  Rhythm Sequence Builder
                  <span
                    ref={seqCountRef}
                    className="inline-block text-center px-2 py-0.5 rounded-full bg-purple-600 text-sm font-bold"
                    style={{ minWidth: '1.75rem' }}
                  >
                    {sequence.length}
                  </span>
                </h3>
                <div className="flex flex-wrap gap-2">
                  <button
                    onClick={playSequence}
                    disabled={sequence.length === 0}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                      sequence.length === 0
                        ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                        : 'bg-purple-600 hover:bg-purple-700'
                    }`}
                  >
                    {playKind === 'sequence' ? <Pause size={16} /> : <Play size={16} />}
                    {playKind === 'sequence' ? 'Stop' : 'Play'} Sequence
                  </button>
                  <button
                    onClick={shuffleSequence}
                    disabled={sequence.length < 2}
                    title="Randomly shuffle the order of the patterns"
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                      sequence.length < 2
                        ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                        : 'bg-indigo-600 hover:bg-indigo-700'
                    }`}
                  >
                    <Shuffle size={16} />
                    Shuffle
                  </button>
                  <button
                    onClick={clearSequence}
                    disabled={sequence.length === 0}
                    className={`px-4 py-2 rounded-lg transition-colors ${
                      sequence.length === 0
                        ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                        : 'bg-red-600 hover:bg-red-700'
                    }`}
                  >
                    Clear
                  </button>
                </div>
              </div>

              {sequence.length === 0 ? (
                <div className="text-center py-8 text-gray-400">
                  Click on patterns below to add them to your sequence
                </div>
              ) : (
                <div className="flex flex-wrap gap-2">
                  {sequence.map((pattern, index) => (
                    <div
                      key={index}
                      ref={(el) => {
                        seqTileRefs.current[index] = el;
                      }}
                      data-tile
                      className="abel-tile relative group bg-gray-700 rounded-lg p-3 border-2 border-purple-400"
                      onPointerDown={(e) => onTilePointerDown(e, index)}
                      onContextMenu={(e) => e.preventDefault()}
                      style={{
                        width: seqTileWidth,
                        maxWidth: '100%',
                        flexShrink: 0,
                        opacity: dragState && dragState.from === index ? 0.35 : 1,
                        transform: dragState && dragState.from === index ? 'scale(0.96)' : 'none',
                        userSelect: 'none',
                        WebkitUserSelect: 'none',
                        WebkitTouchCallout: 'none',
                        transition: 'opacity .15s, transform .15s'
                      }}
                    >
                      {dropSide(index) && (
                        <div
                          style={{
                            position: 'absolute',
                            top: 0,
                            bottom: 0,
                            [dropSide(index) === 'after' ? 'right' : 'left']: -6,
                            width: 3,
                            borderRadius: 2,
                            background: '#fff',
                            boxShadow: '0 0 8px #c084fc',
                            zIndex: 20
                          }}
                        />
                      )}
                      <button
                        onClick={() => removeFromSequence(index)}
                        className="absolute -top-2 -right-2 w-6 h-6 bg-red-500 hover:bg-red-600 rounded-full text-xs font-bold opacity-0 group-hover:opacity-100 transition-opacity z-10"
                      >
                        ×
                      </button>
                      <div className="text-xs font-bold mb-1" style={{ color: labelColorFor(pattern.color) }}>
                        {pattern.letter}
                      </div>
                      <PatternView
                        viewId={`seq:${index}`}
                        pattern={pattern}
                        registry={registryRef}
                        size="sm"
                      />
                      <div
                        className="text-xs text-gray-400 mt-1 font-mono"
                        style={{ visibility: pattern.binary.length > 4 ? 'visible' : 'hidden' }}
                      >
                        {pattern.binary.length} sub.
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Fusion Builder */}
          {isFusionMode && (
            <div className="bg-blue-900/30 border-2 border-blue-500 rounded-lg p-4 mt-4">
              <div className="mb-3">
                <h3 className="text-lg font-bold mb-2">Pattern Fusion Builder</h3>
              </div>

              <div className="space-y-3">
                {/* Selected patterns */}
                <div>
                  <div className="text-sm text-gray-400 mb-2">Selected Patterns:</div>
                  {fusionPatterns.length === 0 ? (
                    <div className="text-center py-4 text-gray-500 bg-gray-800/50 rounded">
                      Click on patterns below to add them to fusion
                    </div>
                  ) : (
                    <div className="flex flex-wrap gap-2 bg-gray-800/50 p-3 rounded">
                      {fusionPatterns.map((pattern, index) => (
                        <div
                          key={index}
                          data-tile
                          className="abel-tile relative group bg-gray-700 rounded-lg p-2 border border-blue-400"
                          style={{ minWidth: Math.max(64, pattern.code.split(' ').length * 16 + 20) }}
                        >
                          <button
                            onClick={() => removeFromFusion(index)}
                            className="absolute -top-2 -right-2 w-5 h-5 bg-red-500 hover:bg-red-600 rounded-full text-xs font-bold opacity-0 group-hover:opacity-100 transition-opacity z-10"
                          >
                            ×
                          </button>
                          <div className="text-xs font-bold" style={{ color: labelColorFor(pattern.color) }}>
                            {pattern.letter}
                          </div>
                          <div className="mt-1">
                            <PatternView
                              viewId={`fpart:${index}`}
                              pattern={pattern}
                              registry={registryRef}
                              size="sm"
                              bar={false}
                            />
                          </div>
                          <div className="text-xs text-gray-400 font-mono mt-1">{pattern.binary}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Fused result */}
                {fusedPattern && (
                  <div>
                    <div className="text-sm text-gray-400 mb-2">Fused Pattern Result:</div>
                    <div className="bg-blue-950/50 border-2 border-blue-400 rounded-lg p-4">
                      <div className="grid md:grid-cols-4 gap-4 mb-4">
                        <div>
                          <div className="text-xs text-gray-400 mb-1">Name</div>
                          <div className="font-bold text-lg text-blue-400">{fusedPattern.letter}</div>
                        </div>
                        <div>
                          <div className="text-xs text-gray-400 mb-1">ABEL Code</div>
                          <div className="font-mono text-sm">{fusedPattern.code}</div>
                        </div>
                        <div>
                          <div className="text-xs text-gray-400 mb-1">Binary</div>
                          <div className="font-mono text-sm">{fusedPattern.binary}</div>
                        </div>
                        <div>
                          <div className="text-xs text-gray-400 mb-1">Subdivisions</div>
                          <div className="font-mono text-sm">{fusedPattern.binary.length}</div>
                        </div>
                      </div>

                      {/* Animated visualisation of the fused pattern */}
                      <div className="mb-4 p-3 bg-gray-900/50 rounded overflow-x-auto">
                        <div style={{ minWidth: Math.max(160, fusedPattern.code.split(' ').length * 30) }}>
                          <PatternView
                            viewId="fused-result"
                            pattern={fusedPattern}
                            registry={registryRef}
                            size="lg"
                          />
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-2">
                        <button
                          onClick={playFusedPattern}
                          className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors"
                        >
                          {playKind === 'fused' ? <Pause size={16} /> : <Play size={16} />}
                          {playKind === 'fused' ? 'Stop' : 'Play'} Fused Pattern
                        </button>
                        <button
                          onClick={addFusedToSequence}
                          className="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition-colors whitespace-nowrap"
                          title="Add this fused pattern to sequence"
                        >
                          Add to Sequence
                        </button>
                        <button
                          onClick={() => {
                            if (isPlaying) stopPlayback();
                            assignToLayer(fusedPattern);
                            setIsFusionMode(false);
                            setIsSequenceMode(false);
                            setIsLayerMode(true);
                          }}
                          className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg transition-colors whitespace-nowrap"
                          title="Place this fused pattern in the selected layer slot"
                        >
                          Add to Layers
                        </button>
                        <button
                          onClick={clearFusion}
                          className="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg transition-colors"
                        >
                          Clear
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>

        {/* Code Groups */}
        <div className="space-y-8">
          {CODE_GROUPS.map((group, groupIdx) => (
            <div key={groupIdx} className="bg-gray-800 rounded-lg p-6">
              <div className="mb-4">
                <div className="flex items-center justify-between mb-2">
                  <h2 className="text-2xl font-bold">{group.range}</h2>
                  <div className="text-sm text-gray-400">{group.name}</div>
                </div>
                <div className="flex gap-4 text-sm text-gray-400">
                  <span>
                    No. of Symbols: <span className="font-mono">N = {group.n}</span>
                  </span>
                  <span>
                    Total Patterns: <span className="font-mono">2^{group.n} = {group.total}</span>
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3">
                {group.patterns.map((pattern) => (
                  <DominoCard
                    key={pattern.letter}
                    pattern={pattern}
                    registry={registryRef}
                    onClick={() => handlePatternClick(pattern)}
                    onLongPress={isFusionMode ? undefined : () => startMerge(pattern)}
                    isMergeSource={!!mergeFirst && mergeFirst.letter === pattern.letter}
                    isSelected={playKind === 'solo' && selectedPattern?.letter === pattern.letter}
                    isInSequence={sequence.some((p) => p.letter === pattern.letter && p.binary === pattern.binary)}
                    isInFusion={fusionPatterns.some((p) => p.letter === pattern.letter && p.binary === pattern.binary)}
                    isInLayer={layers.some((l) => l.pattern && l.pattern.letter === pattern.letter)}
                    isSequenceMode={isSequenceMode}
                    isFusionMode={isFusionMode}
                    isLayerMode={isLayerMode}
                  />
                ))}
              </div>
            </div>
          ))}
        </div>

        {/* Scale of Values */}
        <div className="mt-8 bg-gray-800 rounded-lg p-6">
          <h3 className="text-xl font-bold mb-4">Scale of Values (ABEL)</h3>
          <div className="space-y-4">
            {[
              { letter: 'A', subdivisions: 1, label: 'Whole' },
              { letter: 'B', subdivisions: 2, label: '1/2' },
              { letter: 'E', subdivisions: 3, label: '1/3' },
              { letter: 'L', subdivisions: 4, label: '1/4' }
            ].map(({ letter, subdivisions, label }) => (
              <div key={letter} className="flex items-center gap-4">
                <div className="w-8 font-bold">{letter}</div>
                <div className="flex-1 h-8 bg-gray-700 rounded relative">
                  <div className="absolute inset-0 flex">
                    {Array.from({ length: subdivisions }).map((_, i) => (
                      <div key={i} className="flex-1 border-r border-gray-600 last:border-r-0" />
                    ))}
                  </div>
                </div>
                <div className="text-sm text-gray-400 w-32">{label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Selected Pattern Info */}
        {infoPattern && (
          <div className="mt-8 bg-blue-900/30 border border-blue-500 rounded-lg p-6">
            <h3 className="text-xl font-bold mb-3">Selected Pattern: {infoPattern.letter}</h3>
            <div className="grid md:grid-cols-3 gap-4">
              <div>
                <div className="text-sm text-gray-400 mb-1">ABEL Code</div>
                <div className="font-mono text-lg">{infoPattern.code}</div>
              </div>
              <div>
                <div className="text-sm text-gray-400 mb-1">Binary</div>
                <div className="font-mono text-lg">{infoPattern.binary}</div>
              </div>
              <div>
                <div className="text-sm text-gray-400 mb-1">Decimal</div>
                <div className="font-mono text-lg">{parseInt(infoPattern.binary, 2)}</div>
              </div>
            </div>

            <div className="mt-4 p-3 bg-gray-900/50 rounded overflow-x-auto">
              <div style={{ minWidth: Math.max(160, infoPattern.code.split(' ').length * 30) }}>
                <PatternView viewId="info" pattern={infoPattern} registry={registryRef} size="lg" />
              </div>
            </div>

            <button
              onClick={stopPlayback}
              className="mt-4 flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors"
            >
              <Pause size={16} />
              Stop Loop
            </button>
          </div>
        )}
      </div>
    </div>
  );
};

/* ---- Mount ---- */
ReactDOM.createRoot(document.getElementById('root')).render(<ABELRhythmDominoes />);

<div id="install-bar" role="dialog" aria-label="Install app">
  <span id="install-msg" style="flex:1">Install ABEL for quick, offline access.</span>
  <button id="install-go">Install</button>
  <button id="install-x" aria-label="Dismiss">✕</button>
</div>
<script>
(function(){
  var bar=document.getElementById('install-bar'), go=document.getElementById('install-go'),
      msg=document.getElementById('install-msg'), x=document.getElementById('install-x'), deferred=null;
  function dismissed(){try{return localStorage.getItem('abel-install-dismissed')==='1'}catch(e){return false}}
  function standalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
  x.onclick=function(){bar.style.display='none';try{localStorage.setItem('abel-install-dismissed','1')}catch(e){}};
  if(standalone()||dismissed())return;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();deferred=e;bar.style.display='flex';
  });
  go.onclick=function(){
    if(!deferred)return;deferred.prompt();
    deferred.userChoice.finally(function(){deferred=null;bar.style.display='none'});
  };
  window.addEventListener('appinstalled',function(){bar.style.display='none'});
  // iOS Safari has no install prompt: show manual steps.
  var ua=navigator.userAgent, ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&/Safari/.test(ua)&&!/CriOS|FxiOS/.test(ua)){
    msg.innerHTML='To install: tap <b>Share</b> <span aria-hidden="true">⬆︎</span>, then <b>Add to Home Screen</b>.';
    go.style.display='none';bar.style.display='flex';
  }
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
})();
</script>
