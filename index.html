<script>
  // Settings (theme, haptics) were saved through window.storage in the artifact environment.
  // On a normal website, back the same API with localStorage so those preferences still persist.
  (function () {
    if (window.storage) return;
    window.storage = {
      get: async function (key) {
        try {
          var v = localStorage.getItem(key);
          return v === null ? null : { key: key, value: v };
        } catch (e) { return null; }
      },
      set: async function (key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
        return { key: key, value: value };
      }
    };
  })();
</script>

/* ---- Lucide icons (CDN build of "lucide" rendered as React components) ---- */
const makeIcon = (name) => {
  const Icon = ({ size = 24, color = 'currentColor', strokeWidth = 2, className, style, ...rest }) => {
    const icons = (window.lucide && window.lucide.icons) || {};
    const raw = icons[name] || [];
    // lucide 0.4xx stores icons as ['svg', attrs, children]; older builds store just the children
    const node = raw[0] === 'svg' ? (raw[2] || []) : raw;
    return React.createElement(
      'svg',
      {
        xmlns: 'http://www.w3.org/2000/svg',
        width: size,
        height: size,
        viewBox: '0 0 24 24',
        fill: 'none',
        stroke: color,
        strokeWidth,
        strokeLinecap: 'round',
        strokeLinejoin: 'round',
        className,
        style,
        ...rest
      },
      node.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))
    );
  };
  Icon.displayName = name;
  return Icon;
};

/* =====================================================================
   SAVE & SHARE – a sequence is written as text: patterns separated by ","
   and the parts of a fused pattern joined with "+"  (e.g. A,B',F+K,D)
   ===================================================================== */
const ALL_PATTERNS = Object.values(PATTERNS).flat();
const PATTERN_BY_LETTER = Object.fromEntries(ALL_PATTERNS.map((p) => [p.letter, p]));
const flattenPattern = (p) => (p.parts ? p.parts.flatMap(flattenPattern) : [p]);
const encodeSequence = (seq) => seq.map((p) => flattenPattern(p).map((x) => x.letter).join('+')).join(',');
const decodeSequence = (text) =>
  String(text || '')
    .split(',')
    .map((item) => item.split('+').map((l) => PATTERN_BY_LETTER[l.trim()]))
    .filter((list) => list.length > 0 && list.every(Boolean))
    .map((list) => (list.length === 1 ? list[0] : buildFused(list)));
const SAVED_KEY = 'abel:sequences';

    return Array.isArray(v) ? v : [];

};

/* =====================================================================
   EXPORT – MusicXML (MuseScore, Dorico, Finale, Sibelius…) and MIDI
   One beat = one note value `unit` (0 whole, 1 half, 2 quarter, 3 eighth).
   A pattern with n steps splits its beat into n equal parts, written with
   the same note value as the notation view, with a tuplet when n is not a
   power of two. "•" = note, "–" = rest (or a parenthesised ghost note).
   ===================================================================== */
const EXPORT_INST = {
  snare:   { name: 'Snare Drum', gm: 38, step: 'C', oct: 5, head: 'normal' },
  kick:    { name: 'Kick Drum',  gm: 36, step: 'F', oct: 4, head: 'normal' },
  hihat:   { name: 'Hi-Hat',     gm: 42, step: 'G', oct: 5, head: 'x' },
  clap:    { name: 'Clap',       gm: 39, step: 'D', oct: 5, head: 'x' },
  cowbell: { name: 'Cowbell',    gm: 56, step: 'A', oct: 5, head: 'triangle' },
  tom:     { name: 'Tom',        gm: 47, step: 'A', oct: 4, head: 'normal' },
  rim:     { name: 'Rim Shot',   gm: 37, step: 'C', oct: 5, head: 'x' },
  bass:    { name: 'Bass', pitched: true, step: 'E', oct: 2, midi: 40, program: 34 }
};
const NOTE_TYPES = ['whole', 'half', 'quarter', 'eighth', '16th', '32nd', '64th', '128th', '256th', '512th', '1024th'];
const gcdN = (a, b) => (b ? gcdN(b, a % b) : a);
const lcmN = (a, b) => (a / gcdN(a, b)) * b;
const xmlEsc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const stepsOf = (p) => p.code.split(' ');

// score = { title, tempo, beatsPerBar, unit, ghost, parts: [{ instrument, beats: [pattern | null] }] }
const toMusicXML = (sc) => {
  const Q = 4 / Math.pow(2, sc.unit);                 // quarter notes per beat
  const counts = [1];
  sc.parts.forEach((p) => p.beats.forEach((b) => { if (b) counts.push(stepsOf(b).length); }));
  const D = 2 * counts.reduce(lcmN, 1);               // divisions per quarter note
  const beatDiv = Q * D;
  const bpb = sc.beatsPerBar;

  const partList = sc.parts.map((p, i) => {
    const inst = EXPORT_INST[p.instrument] || EXPORT_INST.snare;
    const id = 'P' + (i + 1);
    const midi = inst.pitched
      ? `<midi-channel>${(i % 9) + 1}</midi-channel><midi-program>${inst.program}</midi-program>`
      : `<midi-channel>10</midi-channel><midi-program>1</midi-program><midi-unpitched>${inst.gm + 1}</midi-unpitched>`;
    return `<score-part id="${id}"><part-name>${xmlEsc(inst.name)}</part-name>` +
      `<score-instrument id="${id}-I1"><instrument-name>${xmlEsc(inst.name)}</instrument-name></score-instrument>` +
      `<midi-instrument id="${id}-I1">${midi}</midi-instrument></score-part>`;
  }).join('');

  const parts = sc.parts.map((p, pi) => {
    const inst = EXPORT_INST[p.instrument] || EXPORT_INST.snare;
    const id = 'P' + (pi + 1);

    const note = (o) => {
      const pitchedOrDrum = o.sound || o.ghost;
      let s = '<note>';
      if (pitchedOrDrum) {
        s += inst.pitched
          ? `<pitch><step>${inst.step}</step><octave>${inst.oct}</octave></pitch>`
          : `<unpitched><display-step>${inst.step}</display-step><display-octave>${inst.oct}</display-octave></unpitched>`;
      } else {
        s += '<rest/>';
      }
      s += `<duration>${o.dur}</duration>`;
      if (pitchedOrDrum) s += `<instrument id="${id}-I1"/>`;
      s += `<voice>1</voice><type>${o.type}</type>`;
      if (o.tm) s += `<time-modification><actual-notes>${o.tm[0]}</actual-notes><normal-notes>${o.tm[1]}</normal-notes></time-modification>`;
      if (pitchedOrDrum) {
        const head = inst.pitched ? 'normal' : inst.head;
        if (o.ghost) s += `<notehead parentheses="yes">${head}</notehead>`;
        else if (head !== 'normal') s += `<notehead>${head}</notehead>`;
      }
      if (o.tuplet) s += `<notations><tuplet type="${o.tuplet}" bracket="yes" show-number="actual"/></notations>`;
      return s + '</note>';
    };

    const beatXml = (pat) => {
      if (!pat) return note({ sound: false, ghost: false, dur: beatDiv, type: NOTE_TYPES[sc.unit] });
      const sy = stepsOf(pat);
      const n = sy.length;
      const lg = Math.floor(Math.log2(n));
      const m = Math.pow(2, lg);
      const type = NOTE_TYPES[Math.min(sc.unit + lg, NOTE_TYPES.length - 1)];
      const dur = beatDiv / n;
      let s = `<direction placement="above"><direction-type><words>${xmlEsc(pat.letter)}</words></direction-type></direction>`;
      sy.forEach((c, i) => {
        const hit = c === '•';
        s += note({
          sound: hit,
          ghost: !hit && sc.ghost,
          dur,
          type,
          tm: n !== m ? [n, m] : null,
          tuplet: n !== m ? (i === 0 ? 'start' : i === n - 1 ? 'stop' : null) : null
        });
      });
      return s;
    };

    const nBars = p.beats.length / bpb;
    let x = `<part id="${id}">`;
    for (let mi = 0; mi < nBars; mi++) {
      x += `<measure number="${mi + 1}">`;
      if (mi === 0) {
        x += `<attributes><divisions>${D}</divisions><key><fifths>0</fifths></key>` +
          `<time><beats>${bpb}</beats><beat-type>${Math.pow(2, sc.unit)}</beat-type></time>` +
          (inst.pitched ? '<clef><sign>F</sign><line>4</line></clef>' : '<clef><sign>percussion</sign><line>2</line></clef>') +
          '</attributes>';
        if (pi === 0) {
          x += `<direction placement="above"><direction-type><metronome><beat-unit>${NOTE_TYPES[sc.unit]}</beat-unit>` +
            `<per-minute>${sc.tempo}</per-minute></metronome></direction-type><sound tempo="${sc.tempo * Q}"/></direction>`;
        }
      }
      for (let b = 0; b < bpb; b++) x += beatXml(p.beats[mi * bpb + b]);
      if (mi === nBars - 1) x += '<barline location="right"><bar-style>light-heavy</bar-style></barline>';
      x += '</measure>';
    }
    return x + '</part>';
  }).join('');

  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">\n' +
    '<score-partwise version="3.1">' +
    `<work><work-title>${xmlEsc(sc.title)}</work-title></work>` +
    '<identification><encoding><software>ABEL Rhythm Alphabet</software></encoding></identification>' +
    `<part-list>${partList}</part-list>${parts}</score-partwise>`;
};

const toMidi = (sc) => {
  const TPQ = 960;
  const Q = 4 / Math.pow(2, sc.unit);
  const beatTicks = Q * TPQ;
  const enc = new TextEncoder();
  const vlq = (v) => { const o = [v & 127]; while ((v >>= 7)) o.unshift((v & 127) | 128); return o; };
  const u32 = (v) => [(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255];
  const u16 = (v) => [(v >>> 8) & 255, v & 255];
  const chunk = (tag, data) => [...enc.encode(tag), ...u32(data.length), ...data];
  const track = (events) => {
    events.sort((a, b) => a.tick - b.tick || a.order - b.order);
    const out = [];
    let last = 0;
    events.forEach((e) => { out.push(...vlq(e.tick - last), ...e.bytes); last = e.tick; });
    out.push(0, 0xff, 0x2f, 0);
    return chunk('MTrk', out);
  };
  const meta = (type, data) => [0xff, type, ...vlq(data.length), ...data];

  const mpqn = Math.round(60000000 / (sc.tempo * Q));
  const head = [
    { tick: 0, order: 0, bytes: meta(0x03, [...enc.encode(sc.title)]) },
    { tick: 0, order: 1, bytes: meta(0x51, [(mpqn >> 16) & 255, (mpqn >> 8) & 255, mpqn & 255]) },
    { tick: 0, order: 2, bytes: meta(0x58, [sc.beatsPerBar, sc.unit, 24, 8]) }
  ];
  const tracks = [track(head)];

  sc.parts.forEach((p, pi) => {
    const inst = EXPORT_INST[p.instrument] || EXPORT_INST.snare;
    const ch = inst.pitched ? pi % 9 : 9;
    const key = inst.pitched ? inst.midi : inst.gm;
    const ev = [{ tick: 0, order: 0, bytes: meta(0x03, [...enc.encode(inst.name)]) }];
    if (inst.pitched) ev.push({ tick: 0, order: 1, bytes: [0xc0 | ch, inst.program - 1] });
    p.beats.forEach((pat, bi) => {
      if (!pat) return;
      const sy = stepsOf(pat);
      const n = sy.length;
      sy.forEach((c, i) => {
        const hit = c === '•';
        if (!hit && !sc.ghost) return;
        const start = Math.round(bi * beatTicks + (i * beatTicks) / n);
        const len = Math.max(10, Math.round((beatTicks / n) * 0.9));
        const vel = hit ? 100 : 40;
        ev.push({ tick: start, order: 1, bytes: [0x90 | ch, key, vel] });
        ev.push({ tick: start + len, order: 0, bytes: [0x80 | ch, key, 0] });
      });
    });
    tracks.push(track(ev));
  });

  const header = chunk('MThd', [...u16(1), ...u16(tracks.length), ...u16(TPQ)]);
  return new Uint8Array([...header, ...tracks.flat()]);
};

// Share sheet on touch devices (installed PWA), plain download elsewhere.
const saveExport = async (data, mime, filename) => {
  const blob = new Blob([data], { type: mime });
  try {
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (coarse && navigator.canShare) {
      const file = new File([blob], filename, { type: mime });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
};

function ExportButtons({ getScore, disabled, className = '' }) {
  const [open, setOpen] = useState(false);
  const [alignRight, setAlignRight] = useState(false);
  const wrapRef = useRef(null);

  // open towards the side that has room, so the menu never runs off the screen
  React.useLayoutEffect(() => {
    if (!open || !wrapRef.current) return;
    const r = wrapRef.current.getBoundingClientRect();
    setAlignRight(r.left + 224 > window.innerWidth - 8 && r.right - 224 >= 8);
  }, [open]);

  // close the menu when tapping elsewhere or pressing Escape
  useEffect(() => {
    if (!open) return undefined;
    const onDown = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') setOpen(false);
    };
    document.addEventListener('pointerdown', onDown);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('pointerdown', onDown);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);
  useEffect(() => {
    if (disabled) setOpen(false);
  }, [disabled]);

  const run = (kind) => {
    setOpen(false);
    const sc = getScore();
    if (!sc) return;
    if (kind === 'xml') saveExport(toMusicXML(sc), 'application/vnd.recordare.musicxml+xml', sc.fileName + '.musicxml');
    else saveExport(toMidi(sc), 'audio/midi', sc.fileName + '.mid');
  };
  const itemCls = 'w-full text-left px-4 h-11 rounded-lg hover:bg-gray-700 whitespace-nowrap';
  return (
    <div ref={wrapRef} className={`relative ${className}`}>
      <button
        onClick={() => setOpen((o) => !o)}
        disabled={disabled}
        aria-haspopup="menu"
        aria-expanded={open}
        className={`w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg transition-colors whitespace-nowrap ${
          disabled ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'bg-gray-700 hover:bg-gray-600'
        }`}
        title="Export this as a score (MuseScore) or a MIDI file"
      >
        <Download size={16} />
        Export
        <span aria-hidden="true" className="text-xs">{open ? '▲' : '▼'}</span>
      </button>
      {open && !disabled && (
        <div
          role="menu"
          className={`absolute ${alignRight ? 'right-0' : 'left-0'} mt-2 p-1 rounded-lg bg-gray-800 border border-gray-600 shadow-xl`}
          style={{ zIndex: 40, minWidth: '14rem', maxWidth: 'calc(100vw - 16px)' }}
        >
          <button role="menuitem" onClick={() => run('xml')} className={itemCls} title="MusicXML: opens directly in MuseScore">
            Score for MuseScore
          </button>
          <button role="menuitem" onClick={() => run('midi')} className={itemCls} title="Standard MIDI file">
            MIDI file
          </button>
        </div>
      )}
    </div>
  );
}

// Light / dark theme switch (set by the main component on every render)
const THEME = { light: false };

// Colour used to draw a pattern: the "white" patterns and the dark prime patterns stay readable in both themes
// Colour of the pattern LETTER labels (A, B', E ...): primes are light gray in both themes,
// and the "white" patterns turn dark gray in light mode so they stay visible on a white background
const labelColorFor = (c) => {
  if (c === '#2d2d2d') return '#9ca3af';
  if (c === '#fff') return THEME.light ? '#374151' : '#fff';
  return c;
};

const accentFor = (c) => {
  if (c === '#2d2d2d') return THEME.light ? '#6b7280' : '#9ca3af';
  if (c === '#fff') return THEME.light ? '#111827' : '#fff';
  return c;
};

const setStepState = (entry, i, state, popMs = 0) => {
  const el = entry && entry.steps[i];
  if (!el) return;
  if (state === 'idle') {
    el.removeAttribute('data-state');
    return;
  }
  el.setAttribute('data-state', state);
  if (popMs && el.animate) {
    try {
      el.animate(
        (el.hasAttribute('data-pie') ? POP_PIE : el.hasAttribute('data-n') ? POP_N : POP)[state],
        { duration: popMs, easing: 'ease-out' }
      );
    } catch (e) {
      /* ignore */
    }
  }
};

const setTileActive = (entry, on) => {
  if (!entry || !entry.tile) return;
  if (on) entry.tile.setAttribute('data-active', '1');
  else entry.tile.removeAttribute('data-active');
};

/* =====================================================================
   PATTERN VIEW – one animated row of dots / dashes
   (registers itself so the audio-clock animator can drive it directly)
   ===================================================================== */
/* ---------- Notation mode: patterns drawn as music notation (1 beat = a note value chosen by the user, quarter by default) ---------- */
// Module-level switch, set by the main component on every render
// unit = the note value that one beat (= one pattern) stands for, as the exponent k of 1/2^k:
// 0 = whole note, 1 = half note, 2 = quarter note (default), 3 = eighth note
const NOTATION = { on: false, ghost: false, unit: 2 };
const NOTE_UNITS = [
  { k: 0, label: 'Whole' },
  { k: 1, label: 'Half' },
  { k: 2, label: 'Quarter' },
  { k: 3, label: 'Eighth' }
];
const NOTE_NAMES = ['whole', 'half', 'quarter', 'eighth', 'sixteenth', 'thirty-second', 'sixty-fourth', 'hundred-twenty-eighth'];
const noteName = (k) => (NOTE_NAMES[k] || `1/${2 ** k}`) + ' note';

// Pop animations for notation glyphs (uniform scale only, so rests are never stretched)
const POP_N = {
  hit: [{ transform: 'scale(1.8)' }, { transform: 'scale(1.35)' }],
  rest: [{ transform: 'scale(1.5)' }, { transform: 'scale(1.2)' }],
  ghost: [{ transform: 'scale(1.5)' }, { transform: 'scale(1.2)' }]
};

const NOTATION_CSS = `
.abel-n-fill{fill:var(--c)}
.abel-n-stroke{stroke:var(--c);fill:none;stroke-linecap:round;stroke-linejoin:round}
.abel-n-stem{stroke:var(--c);opacity:.85}
.abel-n-line{stroke:#9ca3af;fill:none;stroke-width:1.2}
.abel-n-text{fill:#9ca3af;stroke:none}
.abel-n-step{transform-box:fill-box;transform-origin:center;opacity:.8;transition:transform .12s ease-out,opacity .12s ease-out,filter .15s ease-out}
.abel-n-ghost{opacity:.55}
.abel-n-step[data-state="hit"]{opacity:1;transform:scale(1.35);filter:drop-shadow(0 0 5px var(--c))}
.abel-n-step[data-state="rest"]{opacity:1;transform:scale(1.2);filter:drop-shadow(0 0 4px #e5e7eb)}
.abel-n-step[data-state="rest"] .abel-n-stroke{stroke:#e5e7eb}
.abel-n-step[data-state="rest"] .abel-n-fill{fill:#e5e7eb}
.abel-n-step[data-state="ghost"]{opacity:1;transform:scale(1.2);filter:drop-shadow(0 0 5px var(--c))}
`;

// Rests, centred on (cx, cy) where cy is the staff line:
// k=0 whole rest (hangs from the line), k=1 half rest (sits on the line), k=2 quarter rest (squiggle),
// k>=3 flagged rests (eighth, 16th, 32nd...) with k-2 flags
const NotationRest = ({ cx, cy, s, k }) => {
  const tr = `translate(${cx} ${cy}) scale(${s})`;
  const f = Math.max(0, k - 2);
  if (k === 0) {
    return (
      <g transform={tr}>
        <rect x="-5.5" y="0" width="11" height="4.6" rx="0.4" className="abel-n-fill" />
      </g>
    );
  }
  if (k === 1) {
    return (
      <g transform={tr}>
        <rect x="-5.5" y="-4.6" width="11" height="4.6" rx="0.4" className="abel-n-fill" />
      </g>
    );
  }
  if (f === 0) {
    return (
      <g transform={tr}>
        <path d="M-2 -10 L3 -4 L-2 1 L2 6 C-4 5 -5 10 0 12" className="abel-n-stroke" strokeWidth="2" />
      </g>
    );
  }
  const h = 9 + 5 * f;
  const y0 = -h / 2;
  const y1 = h / 2;
  const xs = (y) => 2.5 - 5 * ((y - y0) / (y1 - y0));
  const flags = [];
  for (let k = 0; k < f; k++) {
    const yk = y0 + 3 + 5 * k;
    const fx = xs(yk) - 3.4;
    flags.push(
      <g key={k}>
        <circle cx={fx} cy={yk} r="1.9" className="abel-n-fill" />
        <path
          d={`M${fx + 1.3} ${yk + 1.3} Q${xs(yk) - 1} ${yk + 3.2} ${xs(yk + 3.2)} ${yk + 3.2}`}
          className="abel-n-stroke"
          strokeWidth="1.4"
        />
      </g>
    );
  }
  return (
    <g transform={tr}>
      <line x1={xs(y0)} y1={y0} x2={xs(y1)} y2={y1} className="abel-n-stroke" strokeWidth="1.8" />
      {flags}
    </g>
  );
};

// Closed ellipse as an SVG path (rotation in degrees, same convention as CSS rotate)
function ellipsePath(cx, cy, rx, ry, deg) {
  const t = (deg * Math.PI) / 180;
  const dx = rx * Math.cos(t);
  const dy = rx * Math.sin(t);
  const a = `${(cx - dx).toFixed(2)} ${(cy - dy).toFixed(2)}`;
  const b = `${(cx + dx).toFixed(2)} ${(cy + dy).toFixed(2)}`;
  return `M${a} A${rx} ${ry} ${deg} 1 0 ${b} A${rx} ${ry} ${deg} 1 0 ${a} Z`;
}

// Notehead for the written value 1/2^k: filled for quarter and shorter, open for half, open and wider for whole
const Notehead = ({ x, y, rx, ry, k }) => {
  if (k >= 2) {
    return <ellipse cx={x} cy={y} rx={rx} ry={ry} transform={`rotate(-20 ${x} ${y})`} className="abel-n-fill" />;
  }
  if (k === 1) {
    return (
      <path
        d={ellipsePath(x, y, rx, ry, -20) + ' ' + ellipsePath(x, y, rx * 0.62, ry * 0.42, -35)}
        fillRule="evenodd"
        className="abel-n-fill"
      />
    );
  }
  return (
    <path
      d={ellipsePath(x, y, rx * 1.3, ry * 1.1, 0) + ' ' + ellipsePath(x, y, rx * 0.64, ry * 0.53, -60)}
      fillRule="evenodd"
      className="abel-n-fill"
    />
  );
};

// One beat = one note value `unit` (exponent k0: 0 whole, 1 half, 2 quarter, 3 eighth). n steps per beat:
// each step is written as 1/2^(k0 + floor(log2 n)); with a quarter-note beat that gives
// n=1 quarter, n=2 eighths, n=3 eighth triplet, n=4 sixteenths, n=5/6/7 sixteenth tuplets, n=8 thirty-seconds...
// (flags/beams = k - 2; any n that is not a power of 2 gets a tuplet bracket)
function NotationView({ viewId, pattern, registry, size = 'md', bar = true, ghostNotes = false, unit = 2 }) {
  const rootRef = useRef(null);
  const [w, setW] = useState(0);
  const symbols = pattern.code.split(' ');
  const n = symbols.length;
  const accent = accentFor(pattern.color);

  // inject the notation CSS once
  useEffect(() => {
    if (!document.getElementById('abel-notation-css')) {
      const st = document.createElement('style');
      st.id = 'abel-notation-css';
      st.textContent = NOTATION_CSS;
      document.head.appendChild(st);
    }
  }, []);

  // match the drawing to the real width of its container (so the playhead lines up)
  React.useLayoutEffect(() => {
    const el = rootRef.current;
    if (!el) return undefined;
    const update = () => setW(el.clientWidth);
    update();
    if (typeof ResizeObserver === 'undefined') return undefined;
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // register the glyphs so the audio-clock animator can light them up
  useEffect(() => {
    const root = rootRef.current;
    if (!root) return undefined;
    const entry = {
      steps: Array.from(root.querySelectorAll('[data-step]')),
      bar: root.querySelector('[data-bar]'),
      tile: root.closest('[data-tile]')
    };
    registry.current.set(viewId, entry);
    return () => {
      if (registry.current.get(viewId) === entry) registry.current.delete(viewId);
      entry.steps.forEach((el) => el.removeAttribute('data-state'));
      if (entry.bar) entry.bar.style.transform = 'scaleX(0)';
      if (entry.tile) entry.tile.removeAttribute('data-active');
    };
  }, [viewId, pattern, registry, ghostNotes, unit]);

  const S = { sm: 0.7, md: 0.9, lg: 1.25 }[size] || 0.9;
  const W = w || n * 24;
  const H = 52 * S;
  const slot = W / n;
  const noteY = 42 * S;
  const stemTop = 16 * S;
  const rx = 4.4 * S;
  const ry = 3.3 * S;
  const k = unit + Math.floor(Math.log2(n)); // written note value is 1/2^k
  const nf = Math.max(0, k - 2); // number of flags / beams
  const hasStem = k >= 1;
  const hrx = k === 0 ? rx * 1.3 : rx; // half-width of the notehead
  const gap = nf > 1 ? Math.min(5 * S, (15 * S) / (nf - 1)) : 5 * S; // distance between beams
  const bh = Math.min(3.2 * S, gap - 0.6 * S); // beam thickness
  const isTuplet = (n & (n - 1)) !== 0;
  const sound = symbols.map((sy) => sy === '•');
  const isNote = sound.map((s) => s || ghostNotes); // dashes are ghost notes or rests
  const cx = (i) => (i + 0.5) * slot;
  const stemX = (i) => cx(i) + rx - 0.7 * S;

  // consecutive notes are beamed together; a lone note gets flags; rests break the beam
  const runs = [];
  for (let i = 0; i < n; ) {
    if (isNote[i]) {
      let j = i;
      while (j + 1 < n && isNote[j + 1]) j++;
      runs.push([i, j]);
      i = j + 1;
    } else {
      i++;
    }
  }

  const beams = [];
  const flags = [];
  if (nf >= 1) {
    runs.forEach(([a, b]) => {
      if (b > a) {
        for (let q = 0; q < nf; q++) {
          beams.push(
            <rect
              key={`beam-${a}-${q}`}
              x={stemX(a) - 0.7 * S}
              y={stemTop + q * gap}
              width={stemX(b) - stemX(a) + 1.4 * S}
              height={bh}
              rx={0.8}
              className="abel-n-fill"
            />
          );
        }
      } else {
        for (let q = 0; q < nf; q++) {
          const y0 = stemTop + q * gap;
          const sx = stemX(a);
          flags.push(
            <path
              key={`flag-${a}-${q}`}
              d={`M${sx} ${y0} C${sx} ${y0 + 5 * S} ${sx + 8 * S} ${y0 + 6 * S} ${sx + 6 * S} ${y0 + 13 * S}`}
              className="abel-n-stroke"
              strokeWidth={1.8 * S}
            />
          );
        }
      }
    });
  }

  const bx1 = cx(0) - hrx;
  const bx2 = cx(n - 1) + hrx + 0.5;
  const by = 8 * S;
  const bmid = (bx1 + bx2) / 2;
  const bgap = 7 * S;

  return (
    <div ref={rootRef} className="w-full" style={{ '--c': accent }}>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: 'block', overflow: 'visible' }}>
        {/* one-line percussion staff */}
        <line x1="0" y1={noteY} x2={W} y2={noteY} stroke="#4b5563" strokeWidth="1" />

        {/* stems, beams, flags */}
        {symbols.map((_, i) =>
          isNote[i] && hasStem ? (
            <line
              key={`stem-${i}`}
              x1={stemX(i)}
              y1={noteY - 0.5 * S}
              x2={stemX(i)}
              y2={stemTop}
              className="abel-n-stem"
              strokeWidth={1.3 * S}
            />
          ) : null
        )}
        {beams}
        {flags}

        {/* tuplet bracket + number */}
        {isTuplet && (
          <g className="abel-n-line">
            <path d={`M${bx1} ${by + 4 * S} L${bx1} ${by} L${bmid - bgap} ${by}`} />
            <path d={`M${bmid + bgap} ${by} L${bx2} ${by} L${bx2} ${by + 4 * S}`} />
            <text
              x={bmid}
              y={by + 3.6 * S}
              textAnchor="middle"
              fontSize={10 * S}
              fontStyle="italic"
              fontWeight="700"
              className="abel-n-text"
            >
              {n}
            </text>
          </g>
        )}

        {/* noteheads / ghost notes / rests (one animated glyph per step) */}
        {symbols.map((_, i) => {
          const x = cx(i);
          if (sound[i]) {
            return (
              <g key={`g-${i}`} data-step data-n="1" className="abel-n-step">
                <Notehead x={x} y={noteY} rx={rx} ry={ry} k={k} />
              </g>
            );
          }
          if (ghostNotes) {
            const pl = x - hrx - 3.2 * S;
            const pr = x + hrx + 3.2 * S;
            return (
              <g key={`g-${i}`} data-step data-n="1" className="abel-n-step abel-n-ghost">
                <Notehead x={x} y={noteY} rx={rx} ry={ry} k={k} />
                <path
                  d={`M${pl + 2 * S} ${noteY - 5 * S} Q${pl - 1.5 * S} ${noteY} ${pl + 2 * S} ${noteY + 5 * S}`}
                  className="abel-n-stroke"
                  strokeWidth={1.2 * S}
                />
                <path
                  d={`M${pr - 2 * S} ${noteY - 5 * S} Q${pr + 1.5 * S} ${noteY} ${pr - 2 * S} ${noteY + 5 * S}`}
                  className="abel-n-stroke"
                  strokeWidth={1.2 * S}
                />
              </g>
            );
          }
          return (
            <g key={`g-${i}`} data-step data-n="1" className="abel-n-step">
              <NotationRest cx={x} cy={noteY} s={S} k={k} />
            </g>
          );
        })}
      </svg>
      {bar && (
        <div className="abel-bar">
          <div data-bar />
        </div>
      )}
    </div>
  );
};

/* ---------- Pie mode: each pattern is a circle, one beat = one full clockwise turn ---------- */
// Slice 0 starts at 12 o'clock and the slices follow clockwise: a filled slice is a note, an empty one a rest.
const PIE_CSS = `
.abel-pie{transition:fill .12s ease-out,filter .15s ease-out,opacity .12s ease-out}
.abel-pie-on{fill:var(--c);stroke:#111827;stroke-width:2;stroke-linejoin:round}
.abel-pie-off{fill:rgba(255,255,255,0);stroke:var(--so);stroke-width:1.6;stroke-linejoin:round}
.abel-pie-on[data-state="hit"]{filter:drop-shadow(0 0 6px var(--c)) brightness(1.3)}
.abel-pie-off[data-state="rest"]{fill:rgba(229,231,235,.4);stroke:#fff}
.abel-pie-off[data-state="ghost"]{fill:var(--c);fill-opacity:.4;stroke:#fff}
`;

// Pop animation for pie slices (a quick flash, no scaling)
const POP_PIE = {
  hit: [{ opacity: 0.35 }, { opacity: 1 }],
  rest: [{ opacity: 0.5 }, { opacity: 1 }],
  ghost: [{ opacity: 0.5 }, { opacity: 1 }]
};

const PIE_R = 44;

function pieSlicePath(i, n) {
  const a0 = (i * 2 * Math.PI) / n;
  const a1 = ((i + 1) * 2 * Math.PI) / n;
  const x0 = 50 + PIE_R * Math.sin(a0);
  const y0 = 50 - PIE_R * Math.cos(a0);
  const x1 = 50 + PIE_R * Math.sin(a1);
  const y1 = 50 - PIE_R * Math.cos(a1);
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return `M50 50 L${x0.toFixed(2)} ${y0.toFixed(2)} A${PIE_R} ${PIE_R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}

// The part of the circle already swept by the hand (angle in degrees, clockwise from 12 o'clock)
function pieSweepPath(deg) {
  if (deg <= 0.1) return '';
  if (deg >= 359.9) {
    return `M50 ${50 - PIE_R} A${PIE_R} ${PIE_R} 0 1 1 50 ${50 + PIE_R} A${PIE_R} ${PIE_R} 0 1 1 50 ${50 - PIE_R} Z`;
  }
  const r = (deg * Math.PI) / 180;
  const x = 50 + PIE_R * Math.sin(r);
  const y = 50 - PIE_R * Math.cos(r);
  return `M50 50 L50 ${50 - PIE_R} A${PIE_R} ${PIE_R} 0 ${deg > 180 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z`;
}

function PieView({ viewId, pattern, registry, size = 'md', bar = true }) {
  const rootRef = useRef(null);
  const handRef = useRef(null);
  const sweepRef = useRef(null);
  const symbols = pattern.code.split(' ');
  const n = symbols.length;
  const accent = accentFor(pattern.color);
  const anySound = symbols.some((sy) => sy === '•');
  const outline = anySound ? '#ffffff' : '#9ca3af';
  const maxPx = { sm: 56, md: 72, lg: 120 }[size] || 72;

  // inject the pie CSS once
  useEffect(() => {
    if (!document.getElementById('abel-pie-css')) {
      const st = document.createElement('style');
      st.id = 'abel-pie-css';
      st.textContent = PIE_CSS;
      document.head.appendChild(st);
    }
  }, []);

  // register the slices; the playhead (hand + swept area) is driven through a small "bar" adapter,
  // so the audio-clock animator moves it exactly like the progress bar of the other views
  useEffect(() => {
    const root = rootRef.current;
    if (!root) return undefined;
    const progress = (p) => {
      const deg = Math.max(0, Math.min(1, p)) * 360;
      if (handRef.current) {
        handRef.current.setAttribute('transform', `rotate(${deg.toFixed(2)} 50 50)`);
        handRef.current.style.opacity = deg > 0.1 ? '1' : '0';
      }
      if (sweepRef.current) sweepRef.current.setAttribute('d', pieSweepPath(deg));
    };
    const barAdapter = {
      style: {
        set transform(v) {
          const m = /scaleX\(([-0-9.e]+)\)/.exec(v);
          progress(m ? parseFloat(m[1]) : 0);
        }
      }
    };
    const entry = {
      steps: Array.from(root.querySelectorAll('[data-step]')),
      bar: bar ? barAdapter : null,
      tile: root.closest('[data-tile]')
    };
    registry.current.set(viewId, entry);
    return () => {
      if (registry.current.get(viewId) === entry) registry.current.delete(viewId);
      entry.steps.forEach((el) => el.removeAttribute('data-state'));
      progress(0);
      if (entry.tile) entry.tile.removeAttribute('data-active');
    };
  }, [viewId, pattern, registry, bar]);

  return (
    <div ref={rootRef} className="w-full" style={{ '--c': accent, '--so': outline }}>
      <svg
        viewBox="0 0 100 100"
        style={{ display: 'block', width: '100%', maxWidth: maxPx, margin: '0 auto', overflow: 'visible' }}
      >
        {symbols.map((sy, i) => {
          const cls = 'abel-pie ' + (sy === '•' ? 'abel-pie-on' : 'abel-pie-off');
          if (n === 1) {
            return <circle key={i} data-step data-pie="1" className={cls} cx="50" cy="50" r={PIE_R} />;
          }
          return <path key={i} data-step data-pie="1" className={cls} d={pieSlicePath(i, n)} />;
        })}
        {bar && (
          <g style={{ pointerEvents: 'none' }}>
            <path ref={sweepRef} d="" fill="rgba(255,255,255,0.10)" stroke="none" />
            <line
              ref={handRef}
              x1="50"
              y1="50"
              x2="50"
              y2={50 - PIE_R}
              stroke="#ffffff"
              strokeWidth="2.2"
              strokeLinecap="round"
              style={{ opacity: 0 }}
            />
          </g>
        )}
      </svg>
    </div>
  );
}

// Every view goes through this switch: dots and dashes, music notation, or pie
function PatternView(props) {
  if (NOTATION.pie) return <PieView {...props} />;
  if (NOTATION.on) return <NotationView {...props} ghostNotes={NOTATION.ghost} unit={NOTATION.unit} />;
  return <DotsView {...props} />;
}

const DotsView = ({ viewId, pattern, registry, size = 'md', bar = true }) => {
  const rootRef = useRef(null);
  const symbols = pattern.code.split(' ');
  const n = symbols.length;
  const d = DIMS[size];
  const accent = accentFor(pattern.color);

  const bounds = [];
  if (pattern.parts) {
    let acc = 0;
    pattern.parts.forEach((p, i) => {
      if (i > 0) bounds.push(acc);
      acc += p.code.split(' ').length;

  useEffect(() => {
    const root = rootRef.current;
    if (!root) return undefined;
    const entry = {

      bar: root.querySelector('[data-bar]'),
      tile: root.closest('[data-tile]')
    };
    registry.current.set(viewId, entry);

      if (registry.current.get(viewId) === entry) registry.current.delete(viewId);
      entry.steps.forEach((el) => el.removeAttribute('data-state'));
      if (entry.bar) entry.bar.style.transform = 'scaleX(0)';
      if (entry.tile) entry.tile.removeAttribute('data-active');
    };

  return (
    <div ref={rootRef} className="w-full" style={{ '--c': accent }}>

            key={i}

              <div data-step className="abel-step abel-dot" style={{ width: d.dot, height: d.dot }} />

              <div data-step className="abel-step abel-dash" style={{ width: d.dash, height: d.dashH }} />
            )}
          </div>
        ))}
        {bounds.map((b) => (
          <div
            key={b}
            style={{
              position: 'absolute',
              top: 4,
              bottom: 4,
              left: `${(b / n) * 100}%`,
              width: 1,
              background: 'rgba(255,255,255,0.22)'
            }}
          />
        ))}
      </div>
      {bar && (
        <div className="abel-bar">
          <div data-bar />
        </div>
      )}

};

/* =====================================================================
   DOMINO CARD
   ===================================================================== */
const DominoCard = ({
  pattern,
  onClick,
  isSelected,
  isInSequence,
  isInFusion,
  isInLayer,
  isSequenceMode,
  isFusionMode,
  isLayerMode,
  isMergeSource,
  onLongPress,
  registry
}) => {
  const pressRef = useRef({ timer: null, fired: false, x: 0, y: 0 });

  const clearPress = () => {
    clearTimeout(pressRef.current.timer);
    pressRef.current.timer = null;
  };
  const handleDown = (e) => {
    pressRef.current.fired = false;
    if (!onLongPress) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    clearPress();
    pressRef.current.x = e.clientX;
    pressRef.current.y = e.clientY;
    pressRef.current.timer = setTimeout(() => {
      pressRef.current.timer = null;
      pressRef.current.fired = true;
      onLongPress();
    }, 450);
  };
  const handleMove = (e) => {
    const p = pressRef.current;
    if (p.timer && Math.hypot(e.clientX - p.x, e.clientY - p.y) > 10) clearPress(); // finger is scrolling
  };
  const handleClick = (e) => {
    if (pressRef.current.fired) {
      pressRef.current.fired = false; // the click that ends a long-press is not a tap
      return;
    }
    onClick(e);
  };

  return (
    <button
      data-tile
      onClick={handleClick}
      onPointerDown={handleDown}
      onPointerMove={handleMove}
      onPointerUp={clearPress}
      onPointerLeave={clearPress}
      onPointerCancel={clearPress}
      onContextMenu={(e) => e.preventDefault()}
      className={`abel-tile select-none relative flex flex-col items-center justify-center p-3 rounded-lg transition-all border-2 ${
        isMergeSource
          ? 'border-amber-400 bg-gray-700 scale-105'
          : isSelected
          ? 'border-blue-500 bg-gray-700 scale-105'
          : isFusionMode && isInFusion
          ? 'border-blue-400 bg-gray-700'
          : isSequenceMode && isInSequence
          ? 'border-purple-400 bg-gray-700'
          : isLayerMode && isInLayer
          ? 'border-emerald-400 bg-gray-700'
          : 'border-gray-600 bg-gray-800 hover:bg-gray-700 hover:border-gray-500'
      }`}
      style={{ minWidth: '80px' }}
    >
      <div className="text-xs font-bold mb-2" style={{ color: labelColorFor(pattern.color) }}>
        {pattern.letter}
      </div>
      <PatternView viewId={`grid:${pattern.letter}`} pattern={pattern} registry={registry} size="md" />
      <div className="text-xs text-gray-500 mt-2 font-mono">{pattern.binary}</div>
    </button>
  );
};

/* =====================================================================
   AUDIO – synthesised instruments (all routed to a master gain so that
   Stop silences everything instantly, even notes already scheduled)
   ===================================================================== */
const makeNoise = (ctx, dur) => {
  const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * dur)), ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  return src;
};

const playSnare = (ctx, time, vol, dest) => {
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  osc1.frequency.value = 180;
  osc2.frequency.value = 330;
  osc1.type = 'triangle';
  osc2.type = 'triangle';
  const og = ctx.createGain();
  og.gain.setValueAtTime(0, time);
  og.gain.linearRampToValueAtTime(0.25 * vol, time + 0.001);
  og.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
  osc1.connect(og);
  osc2.connect(og);
  og.connect(dest);

  const noise = makeNoise(ctx, 0.15);
  const f = ctx.createBiquadFilter();
  f.type = 'highpass';
  f.frequency.value = 2000;
  f.Q.value = 1;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0, time);
  ng.gain.linearRampToValueAtTime(0.35 * vol, time + 0.001);
  ng.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
  noise.connect(f);
  f.connect(ng);
  ng.connect(dest);

  osc1.start(time);
  osc1.stop(time + 0.08);
  osc2.start(time);
  osc2.stop(time + 0.08);
  noise.start(time);
  noise.stop(time + 0.15);
};

const playKick = (ctx, time, vol, dest) => {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(40, time + 0.1);
  gain.gain.setValueAtTime(0.8 * vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
  osc.connect(gain);
  gain.connect(dest);
  osc.start(time);
  osc.stop(time + 0.3);
};

const playHiHat = (ctx, time, vol, dest) => {
  const noise = makeNoise(ctx, 0.1);
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 7000;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.3 * vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(dest);
  noise.start(time);
  noise.stop(time + 0.1);
};

const playClap = (ctx, time, vol, dest) => {
  for (let i = 0; i < 3; i++) {
    const noise = makeNoise(ctx, 0.08);
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1500;
    filter.Q.value = 2;
    const gain = ctx.createGain();
    const t = time + i * 0.01;
    gain.gain.setValueAtTime(0.25 * vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(dest);
    noise.start(t);
    noise.stop(t + 0.08);
  }
};

const playCowbell = (ctx, time, vol, dest) => {
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  osc1.frequency.value = 540;
  osc2.frequency.value = 800;
  osc1.type = 'square';
  osc2.type = 'square';
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.3 * vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(dest);
  osc1.start(time);
  osc1.stop(time + 0.15);
  osc2.start(time);
  osc2.stop(time + 0.15);
};

const playTom = (ctx, time, vol, dest) => {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.setValueAtTime(220, time);
  osc.frequency.exponentialRampToValueAtTime(110, time + 0.15);
  osc.type = 'sine';
  gain.gain.setValueAtTime(0.5 * vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
  osc.connect(gain);
  gain.connect(dest);
  osc.start(time);
  osc.stop(time + 0.2);
};

const playRimShot = (ctx, time, vol, dest) => {
  const osc = ctx.createOscillator();
  osc.frequency.value = 400;
  osc.type = 'square';
  const noise = makeNoise(ctx, 0.02);
  const oscGain = ctx.createGain();
  const noiseGain = ctx.createGain();
  oscGain.gain.setValueAtTime(0.2 * vol, time);
  oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.02);
  noiseGain.gain.setValueAtTime(0.4 * vol, time);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.015);
  osc.connect(oscGain);
  oscGain.connect(dest);
  noise.connect(noiseGain);
  noiseGain.connect(dest);
  osc.start(time);
  osc.stop(time + 0.02);
  noise.start(time);
  noise.stop(time + 0.02);
};

const playBass = (ctx, time, vol, dest) => {
  const fundamental = ctx.createOscillator();
  const harmonic1 = ctx.createOscillator();
  const harmonic2 = ctx.createOscillator();
  fundamental.frequency.value = 41.2;
  harmonic1.frequency.value = 82.4;
  harmonic2.frequency.value = 123.6;
  fundamental.type = 'sine';
  harmonic1.type = 'sine';
  harmonic2.type = 'sine';

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 600;
  filter.Q.value = 1;

  const fg = ctx.createGain();
  const h1g = ctx.createGain();
  const h2g = ctx.createGain();
  const master = ctx.createGain();

  fg.gain.setValueAtTime(0, time);
  fg.gain.linearRampToValueAtTime(0.5 * vol, time + 0.01);
  fg.gain.linearRampToValueAtTime(0.35 * vol, time + 0.05);
  fg.gain.setValueAtTime(0.35 * vol, time + 0.2);
  fg.gain.exponentialRampToValueAtTime(0.001, time + 0.4);

  h1g.gain.setValueAtTime(0, time);
  h1g.gain.linearRampToValueAtTime(0.2 * vol, time + 0.01);
  h1g.gain.exponentialRampToValueAtTime(0.001, time + 0.35);

  h2g.gain.setValueAtTime(0, time);
  h2g.gain.linearRampToValueAtTime(0.1 * vol, time + 0.01);
  h2g.gain.exponentialRampToValueAtTime(0.001, time + 0.3);

  master.gain.value = 0.6;

  fundamental.connect(fg);
  harmonic1.connect(h1g);
  harmonic2.connect(h2g);
  fg.connect(filter);
  h1g.connect(filter);
  h2g.connect(filter);
  filter.connect(master);
  master.connect(dest);

  fundamental.start(time);
  fundamental.stop(time + 0.4);
  harmonic1.start(time);
  harmonic1.stop(time + 0.35);
  harmonic2.start(time);
  harmonic2.stop(time + 0.3);
};

const INSTRUMENT_FN = {
  snare: playSnare,
  kick: playKick,
  hihat: playHiHat,
  clap: playClap,
  cowbell: playCowbell,
  tom: playTom,
  rim: playRimShot,
  bass: playBass
};

// Every instrument is rendered ONCE (same synth, rendered offline into a buffer) so that each
// hit is identical: same pitch sweep, same level, same noise, and much lighter on the CPU.
const renderSamples = async (ctx) => {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC) return null;
  const out = {};
  try {
    for (const key of Object.keys(INSTRUMENT_FN)) {
      const off = new OAC(1, Math.ceil(ctx.sampleRate * 0.5), ctx.sampleRate);
      INSTRUMENT_FN[key](off, 0, 1, off.destination);
      out[key] = await off.startRendering();
    }
  } catch (e) {
    return null; // fall back to live synthesis
  }
  return out;
};

const CHOKE_TIME = 0.004;

const playInstrument = (ctx, time, instrument, isGhost, dest, samples, voices, lane) => {
  const vol = isGhost ? 0.1 : 1;
  const buf = samples && samples[instrument];
  if (!buf) {
    // samples not ready (or unsupported): live synthesis
    (INSTRUMENT_FN[instrument] || playSnare)(ctx, time, vol, dest);
    return;
  }

  const src = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.value = vol;
  src.connect(gain);
  gain.connect(dest);

  // One voice per instrument and lane: when a new hit starts, the previous one is faded out in
  // 4 ms. Tails no longer pile up on fast repeats, so level and pitch stay constant.
  const key = `${instrument}:${lane}`;
  const prev = voices && voices.get(key);
  if (prev && time > prev.start) {
    const from = Math.max(prev.start, time - CHOKE_TIME);
    prev.gain.gain.setValueAtTime(prev.vol, from);
    prev.gain.gain.linearRampToValueAtTime(0, time);
  }
  if (voices) voices.set(key, { gain, start: time, vol });

  src.start(time);
};

const playClick = (ctx, time, isDownbeat, dest, isSub = false) => {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(dest);
  // Subdivision clicks (2nd, 3rd, 4th click of a beat) are softer and lower than the beat click
  osc.frequency.value = isSub ? 1000 : isDownbeat ? 800 : 1200;
  osc.type = 'sine';
  const dur = isSub ? 0.03 : 0.04;
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(isSub ? 0.07 : isDownbeat ? 0.25 : 0.15, time + 0.001);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  osc.start(time);
  osc.stop(time + dur);
};

/* Time of the audio that is actually being HEARD right now
   (compensates the browser's reported output latency). */
const getHeardTime = (ctx) => {
  try {
    if (typeof ctx.getOutputTimestamp === 'function') {
      const ts = ctx.getOutputTimestamp();
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
        const t = ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
        if (t <= ctx.currentTime + 0.02 && t >= ctx.currentTime - 0.6) return t;
      }
    }
  } catch (e) {
    /* fall back below */
  }
  return ctx.currentTime - Math.min(ctx.outputLatency || 0, 0.5);
};

/* =====================================================================
   MAIN COMPONENT
   ===================================================================== */
const ABELRhythmDominoes = () => {
  const [showInfo, setShowInfo] = useState(false);
  const [tempo, setTempo] = useState(120);
  const [metronomeEnabled, setMetronomeEnabled] = useState(true);
  const [clicksPerBeat, setClicksPerBeat] = useState(1); // metronome clicks per beat: 1-4
  const [ghostNotesEnabled, setGhostNotesEnabled] = useState(true);
  const [syncOffset, setSyncOffset] = useState(0);
  const [showSync, setShowSync] = useState(false);
  const [hapticsEnabled, setHapticsEnabled] = useState(true); // on by default (a saved choice overrides it)

  // ---------- Haptics (Web Vibration API, with graceful fallback) ----------
  const hapticsSupported = typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function';
  // The Vibration API only controls duration, so "intensity" = pulse length (ms):
  // 1 = ghost note, 2 = played note, 3 = beat, 4 = downbeat (first beat of the bar)
  const HAPTIC_MS = { 1: 6, 2: 14, 3: 24, 4: 42 };
  const safeVibrate = (pattern) => {
    try {
      if (hapticsSupported) return navigator.vibrate(pattern);
    } catch (e) {
      /* never let haptics break audio playback */
    }
    return false;
  };
  const hapticsOnRef = useRef(false);
  hapticsOnRef.current = hapticsEnabled && hapticsSupported;
  const hapticLastRef = useRef({ segId: null, steps: [] });

  // Called from the audio-clock animator: fires exactly when a beat / note is heard
  const fireHaptics = (seg, p) => {
    if (!hapticsOnRef.current) return;
    try {
      const h = hapticLastRef.current;
      let level = 0;
      if (h.segId !== seg.id) {
        h.segId = seg.id;
        h.steps = seg.tracks.map(() => -1);
        if (seg.metro) level = seg.beatPos === 0 ? 4 : 3; // mirrors the audible metronome click
      }
      seg.tracks.forEach((track, ti) => {
        const step = Math.min(track.n - 1, Math.floor(p * track.n));
        if (h.steps[ti] !== step) {
          h.steps[ti] = step;
          if (track.sound[step]) level = Math.max(level, 2);
          else if (seg.ghost) level = Math.max(level, 1);
        }
      });
      if (level) safeVibrate(HAPTIC_MS[level]);
    } catch (e) {
      /* ignore */
    }

  const toggleHaptics = () => {
    if (!hapticsSupported) return;

  const [selectedPattern, setSelectedPattern] = useState(null);

  const [sequence, setSequence] = useState([]);
  const [isSequenceMode, setIsSequenceMode] = useState(false);
  const [isFusionMode, setIsFusionMode] = useState(false);
  const [isLayerMode, setIsLayerMode] = useState(false);
  const [fusionPatterns, setFusionPatterns] = useState([]);
  const [fusedPattern, setFusedPattern] = useState(null);
  const [layers, setLayers] = useState([
    { pattern: null, instrument: 'snare' },
    { pattern: null, instrument: 'kick' },
    { pattern: null, instrument: 'hihat' },
    { pattern: null, instrument: 'clap' }

  const [activeLayer, setActiveLayer] = useState(0);

  const ctxRef = useRef(null);
  const masterRef = useRef(null);
  const schedulerIdRef = useRef(null);
  const rafRef = useRef(null);
  const nextBeatRef = useRef(0);
  const beatCountRef = useRef(0);
  const seqPosRef = useRef(0);
  const segIdRef = useRef(0);
  const segmentsRef = useRef([]);
  const playRef = useRef(null);
  const samplesRef = useRef(null);

  const settingsRef = useRef({});
  const sequenceRef = useRef([]);
  const fusedRef = useRef(null);
  const layersRef = useRef([]);
  settingsRef.current = {
    tempo,
    metronome: metronomeEnabled,

    ghost: ghostNotesEnabled,
    instrument: selectedInstrument,

  fusedRef.current = fusedPattern;
  layersRef.current = layers;

  const registryRef = useRef(new Map());
  const litRef = useRef(new Map());
  const beatsContainerRef = useRef(null);
  const beatElsRef = useRef([]);
  const beatLitRef = useRef({ segId: null });

    ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    const createdCtx = ctxRef.current;

    return () => {

  useEffect(() => {

  /* ---------------- Animator (driven by the audio clock) ---------------- */
  const clearLit = () => {
    for (const [, prev] of litRef.current) {
      setStepState(prev.entry, prev.idx, 'idle');
      setTileActive(prev.entry, false);
      if (prev.entry.bar) prev.entry.bar.style.transform = 'scaleX(0)';
    }
    litRef.current.clear();
    beatLitRef.current.segId = null;
    beatElsRef.current.forEach((e) => {
      e.removeAttribute('data-state');
      e.removeAttribute('data-muted');
    });
  };

  const applyBeat = (seg) => {
    const els = beatElsRef.current;
    const b = beatLitRef.current;
    if (!seg) {
      if (b.segId !== null) {
        els.forEach((e) => e.removeAttribute('data-state'));
        b.segId = null;
      }
      return;
    }
    if (b.segId === seg.id) return;
    b.segId = seg.id;
    els.forEach((e) => {
      const bi = Number(e.getAttribute('data-bi'));
      if (bi === seg.beatPos) e.setAttribute('data-state', bi === 0 ? 'down' : 'on');
      else e.removeAttribute('data-state');
      e.setAttribute('data-muted', seg.metro ? '0' : '1');
      if (bi === seg.beatPos && e.animate) {
        try {
          e.animate(
            [{ transform: 'scale(2.2)' }, { transform: bi === 0 ? 'scale(1.4)' : 'scale(1.25)' }],
            { duration: 200, easing: 'ease-out' }
          );
        } catch (err) {
          /* ignore */
        }
      }
    });
  };

  const applyFrame = (frame) => {
    const reg = registryRef.current;
    const lit = litRef.current;
    const active = new Set();

    if (frame) {
      const { seg, p } = frame;
      for (const track of seg.tracks) {
        const step = Math.min(track.n - 1, Math.floor(p * track.n));
        const popMs = Math.max(60, Math.min((seg.dur / track.n) * 1000, 260));
        for (const tg of track.targets) {
          const entry = reg.get(tg.viewId);
          if (!entry) continue;
          const local = step - tg.offset;
          if (local < 0 || local >= tg.count) continue;
          active.add(tg.viewId);
          const prev = lit.get(tg.viewId);
          if (!prev || prev.entry !== entry || prev.idx !== local || prev.segId !== seg.id) {
            if (prev && prev.entry === entry) setStepState(entry, prev.idx, 'idle');
            const state = track.sound[step] ? 'hit' : seg.ghost ? 'ghost' : 'rest';
            setStepState(entry, local, state, popMs);
            setTileActive(entry, true);
            if (fsActiveRef.current && entry.tile && String(tg.viewId).startsWith('seq:')) followTile(entry.tile);
            lit.set(tg.viewId, { entry, idx: local, segId: seg.id });
          }
          if (entry.bar && tg.count === track.n) {
            entry.bar.style.transform = `scaleX(${p.toFixed(4)})`;
          }
        }
      }
    }

    for (const [id, prev] of lit) {
      if (!active.has(id)) {
        setStepState(prev.entry, prev.idx, 'idle');
        setTileActive(prev.entry, false);
        if (prev.entry.bar) prev.entry.bar.style.transform = 'scaleX(0)';
        lit.delete(id);
      }
    }

    applyBeat(frame ? frame.seg : null);
  };

  const animate = () => {
    rafRef.current = requestAnimationFrame(animate);
    const ctx = ctxRef.current;
    if (!ctx || !playRef.current) return;

    const now = getHeardTime(ctx) - settingsRef.current.sync / 1000;
    const q = segmentsRef.current;
    while (q.length > 1 && q[1].start <= now) q.shift();
    const seg = q[0];

    if (!seg || now < seg.start || now >= seg.start + seg.dur) {
      applyFrame(null);
      return;
    }
    const p = (now - seg.start) / seg.dur;
    fireHaptics(seg, p);
    applyFrame({ seg, p });
  };

  /* ---------------- Scheduler (audio + visual timeline together) ---------------- */
  const scheduleBeat = (ctx, t) => {
    const s = settingsRef.current;
    const play = playRef.current;
    const dest = masterRef.current;
    if (!play || !dest) return false;

    const beat = 60 / s.tempo;

    // 1) Decide which tracks play on this beat
    const defs = [];
    if (play.mode === 'solo') {
      if (play.pattern) {
        defs.push({
          pattern: play.pattern,
          instrument: s.instrument,
          viewIds: [`grid:${play.pattern.letter}`, 'info']
        });
      }
    } else if (play.mode === 'fused') {
      const fp = fusedRef.current;
      if (fp) {
        defs.push({ pattern: fp, instrument: s.instrument, viewIds: ['fused-result', 'info'], withParts: true });
      }
    } else if (play.mode === 'sequence') {
      const seq = sequenceRef.current;
      if (seq.length) {
        const idx = seqPosRef.current % seq.length;
        seqPosRef.current = idx + 1;
        const pat = seq[idx];
        const viewIds = [`seq:${idx}`];
        if (!pat.parts) viewIds.push(`grid:${pat.letter}`);
        defs.push({ pattern: pat, instrument: s.instrument, viewIds });
      }
    } else {
      layersRef.current.forEach((layer, i) => {
        if (layer.pattern) {
          defs.push({
            pattern: layer.pattern,
            instrument: layer.instrument,
            viewIds: [`layer:${i}`, `grid:${layer.pattern.letter}`]
          });
        }
      });
    }
    if (defs.length === 0) return false;

    // 2) Metronome click
    const beatPos = beatCountRef.current % Math.max(1, s.beats);
    beatCountRef.current += 1;
    if (s.metronome) {
      const clicks = Math.max(1, Math.min(4, s.clicks || 1));
      for (let k = 0; k < clicks; k++) {
        playClick(ctx, t + (k * beat) / clicks, beatPos === 0, dest, k > 0);
      }
    }

    // 3) Audio for every track + matching visual timeline
    const tracks = defs.map((def) => {
      const symbols = def.pattern.code.split(' ');
      const n = symbols.length;
      const sound = symbols.map((sy) => sy === '•');
      const targets = def.viewIds.map((viewId) => ({ viewId, offset: 0, count: n }));
      if (def.withParts && def.pattern.parts) {
        let off = 0;
        def.pattern.parts.forEach((part, k) => {
          const c = part.code.split(' ').length;
          targets.push({ viewId: `fpart:${k}`, offset: off, count: c });
          off += c;
        });
      }
      const stepDur = beat / n;
      const lane = def.viewIds[0].startsWith('layer:') ? def.viewIds[0] : 'main';
      const samples = samplesRef.current;
      const voices = voicesRef.current;
      for (let i = 0; i < n; i++) {
        const tt = t + i * stepDur;
        if (sound[i]) playInstrument(ctx, tt, def.instrument, false, dest, samples, voices, lane);
        else if (s.ghost) playInstrument(ctx, tt, def.instrument, true, dest, samples, voices, lane);
      }
      return { n, sound, targets };
    });

    segmentsRef.current.push({
      id: ++segIdRef.current,
      start: t,
      dur: beat,
      ghost: s.ghost,
      metro: s.metronome,
      beatPos,
      tracks
    });

    return true;
  };

  const scheduler = () => {
    const ctx = ctxRef.current;
    if (!ctx || !playRef.current) return;
    const ahead = 0.2;
    if (nextBeatRef.current < ctx.currentTime - 0.05) {
      nextBeatRef.current = ctx.currentTime + 0.05; // resync if the page was throttled
    }
    while (nextBeatRef.current < ctx.currentTime + ahead) {
      if (!scheduleBeat(ctx, nextBeatRef.current)) {

        return;
      }
    }
    const q = segmentsRef.current;
    while (q.length > 8) q.shift();
  };

  const stopEngine = () => {
    if (schedulerIdRef.current) {
      clearInterval(schedulerIdRef.current);
      schedulerIdRef.current = null;
    }
    if (rafRef.current) {
      cancelAnimationFrame(rafRef.current);
      rafRef.current = null;
    }
    playRef.current = null;
    segmentsRef.current = [];

    const ctx = ctxRef.current;
    const m = masterRef.current;
    if (m && ctx) {
      try {
        const now = ctx.currentTime;
        m.gain.cancelScheduledValues(now);
        m.gain.setValueAtTime(m.gain.value, now);
        m.gain.linearRampToValueAtTime(0, now + 0.01);
      } catch (e) {
        /* ignore */
      }
      setTimeout(() => {
        try {
          m.disconnect();
        } catch (e) {
          /* ignore */
        }

    }
    masterRef.current = null;
    hapticLastRef.current = { segId: null, steps: [] };
    safeVibrate(0); // cancel any vibration in progress

  };

    const ctx = ctxRef.current;
    if (!ctx) return;

    const master = ctx.createGain();
    master.gain.value = mode === 'layers' ? 0.7 : 1; // headroom when several instruments play together
    master.connect(ctx.destination);
    masterRef.current = master;

    playRef.current = { mode, pattern };
    segmentsRef.current = [];
    beatCountRef.current = 0;
    seqPosRef.current = 0;
    nextBeatRef.current = ctx.currentTime + 0.08;

  };

    stopEngine();
    setPlayKind(null);
    setSelectedPattern(null);
  };

  /* ---------------- UI actions ---------------- */
  const assignToLayer = (pattern) => {
    const next = layers.map((l, i) => (i === activeLayer ? { ...l, pattern } : l));
    setLayers(next);
    // move the selection to the next empty slot (if any)
    for (let k = 1; k <= MAX_LAYERS; k++) {

      if (!next[j].pattern) {
        setActiveLayer(j);
        break;
      }
    }
  };

  // ---------- Tempo: slider, typed value, and +/- buttons ----------
  const [tempoDraft, setTempoDraft] = useState(null); // text being typed (null = show the real tempo)
  const tempoHoldRef = useRef({ t: null, i: null });

  const [displayMode, setDisplayMode] = useState('dots'); // 'dots' | 'notation' | 'pie'

    let cancelled = false;
    (async () => {

    };

  const pieMode = displayMode === 'pie';
  const setNotationMode = (on) => setDisplayMode(on ? 'notation' : 'dots');
  const setPieMode = (on) => setDisplayMode(on ? 'pie' : 'dots');
  NOTATION.on = notationMode;
  NOTATION.pie = pieMode;
  NOTATION.ghost = notationGhost;

  const [noteUnit, setNoteUnitState] = useState(2);
  NOTATION.unit = noteUnit;

  // restore the saved choice (if the environment can store it); quarter note stays the default
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        if (window.storage) {
          const r = await window.storage.get('abel:noteUnit');

      }

    };
  }, []);

  const setNoteUnit = (k) => {
    setNoteUnitState(k);
    try {

    } catch (e) {
      /* could not be saved: ignore */
    }

  const clampTempo = (v) => Math.min(300, Math.max(1, Math.round(v)));

  const changeTempo = (v) => {
    const next = clampTempo(v);

    settingsRef.current.tempo = next; // the very next scheduled beat already uses it
    const ctx = ctxRef.current;
    const p = playRef.current;
    if (p && ctx && nextBeatRef.current - ctx.currentTime > 1) {

      startPlayback(p.mode, p.pattern);
    }
  };

  const commitTempoDraft = () => {
    if (tempoSkipRef.current) {
      tempoSkipRef.current = false;
      setTempoDraft(null);
      return;
    }
    if (tempoDraft === null) return;
    const n = parseInt(tempoDraft, 10);
    if (!Number.isNaN(n)) changeTempo(n);
    setTempoDraft(null);
  };

  const stopTempoHold = () => {
    clearTimeout(tempoHoldRef.current.t);
    clearInterval(tempoHoldRef.current.i);
    tempoHoldRef.current = { t: null, i: null };
  };
  const startTempoHold = (delta) => {
    stopTempoHold();
    const step = () => changeTempo(settingsRef.current.tempo + delta);
    step();

    tempoHoldRef.current.t = setTimeout(() => {
      tempoHoldRef.current.i = setInterval(step, 70);
    }, 400);
  };
  useEffect(() => () => stopTempoHold(), []);

  // ---------- Quick merge: long-press a pattern, then tap a second one ----------
  const [mergeFirst, setMergeFirst] = useState(null);

  useEffect(() => {
    if (isFusionMode) setMergeFirst(null); // not needed in Fusion mode
  }, [isFusionMode]);

  const startMerge = (pattern) => {
    setMergeFirst(pattern);
    if (hapticsOnRef.current) safeVibrate(20);
  };

  // Where the merged pattern goes depends on the current mode
  const placeMerged = (merged) => {
    if (hapticsOnRef.current) safeVibrate([12, 40, 12]);
    if (isLayerMode) {
      assignToLayer(merged); // selected layer slot
    } else if (isSequenceMode) {
      setSequence((prev) => [...prev, merged]); // end of the sequence
    } else {
      setSelectedPattern(merged); // plays in a loop like a single pattern
      setPlayKind('solo');
      startPlayback('solo', merged);
    }
  };

  const handlePatternClick = (pattern) => {
    // second tap of a quick merge
    if (mergeFirst && !isFusionMode) {
      const merged = buildFused([mergeFirst, pattern]);
      setMergeFirst(null);
      placeMerged(merged);
      return;
    }
    if (isLayerMode) {
      assignToLayer(pattern);
      return;
    }
    if (isFusionMode) {
      addToFusion(pattern);
      return;
    }
    if (isSequenceMode) {
      setSequence((prev) => [...prev, pattern]);
      return;
    }
    if (playKind === 'solo' && selectedPattern?.letter === pattern.letter) {
      stopPlayback();
      return;
    }
    setSelectedPattern(pattern);
    setPlayKind('solo');
    startPlayback('solo', pattern);
  };

  // One mode at a time. Switching never deletes anything: the sequence, the fusion and the layers are kept.
  const mode = isLayerMode ? 'layers' : isFusionMode ? 'fusion' : isSequenceMode ? 'sequence' : 'single';
  const setMode = (m) => {
    if (m === mode) return;
    if (isPlaying) stopPlayback();
    setMergeFirst(null);
    setIsSequenceMode(m === 'sequence');
    setIsFusionMode(m === 'fusion');
    setIsLayerMode(m === 'layers');
  };

  const playSequence = () => {
    if (sequence.length === 0) return;
    if (playKind === 'sequence') {
      stopPlayback();
      return;
    }
    setSelectedPattern(null);
    setPlayKind('sequence');
    startPlayback('sequence', null);
  };

  const clearSequence = () => {
    if (isPlaying) stopPlayback();
    offerUndo(sequence, 'Sequence cleared');
    setSequence([]);
  };

  const [shuffling, setShuffling] = useState(false);
  const shuffleFlipRef = useRef(null);
  const [shuffleTick, setShuffleTick] = useState(0);

  const shuffleSequence = () => {
    if (sequence.length < 2) return;
    const key = (p) => p.letter + ':' + p.binary;
    const signature = (arr) => arr.map(key).join('|');
    const original = signature(sequence);
    const canChange = new Set(sequence.map(key)).size > 1;
    // Shuffle the INDICES (Fisher-Yates) so we know where each frame travels from / to;
    // retry so the order really changes whenever that is possible
    let order = sequence.map((_, i) => i);
    for (let attempt = 0; attempt < 10; attempt++) {
      order = sequence.map((_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      if (!canChange || signature(order.map((i) => sequence[i])) !== original) break;
    }
    // Remember where every tile is now; the animation runs right after the new order renders
    const rects = seqTileRefs.current.slice(0, sequence.length).map((el) => (el ? el.getBoundingClientRect() : null));
    shuffleFlipRef.current = { order, rects };
    offerUndo(sequence, 'Sequence shuffled');
    setSequence(order.map((i) => sequence[i]));
    setShuffleTick((t) => t + 1);
    setShuffling(true);
    setTimeout(() => setShuffling(false), 650);
  };

  // FLIP animation: each frame flies from its old slot to its new one
  React.useLayoutEffect(() => {
    const data = shuffleFlipRef.current;
    if (!data) return;
    shuffleFlipRef.current = null;
    try {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const { order, rects } = data;
      order.forEach((oldIdx, newIdx) => {
        const el = seqTileRefs.current[newIdx];
        const from = rects[oldIdx];
        if (!el || !from || !el.animate) return;
        const to = el.getBoundingClientRect();
        const dx = from.left - to.left;
        const dy = from.top - to.top;
        const tilt = (Math.random() * 2 - 1) * 8;
        const moved = dx !== 0 || dy !== 0;
        el.animate(
          [
            { transform: `translate(${dx}px, ${dy}px) rotate(0deg) scale(1)`, zIndex: 30, offset: 0 },
            { transform: `translate(${dx * 0.45}px, ${dy * 0.45 - (moved ? 14 : 0)}px) rotate(${tilt}deg) scale(1.1)`, zIndex: 30, offset: 0.45 },
            { transform: 'translate(0, 0) rotate(0deg) scale(1)', zIndex: 30, offset: 1 }
          ],
          { duration: 520, delay: Math.min(newIdx * 25, 200), easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'backwards' }
        );
      });
    } catch (e) {
      /* animation is cosmetic: never let it break the app */
    }

    setActionToast({ msg: `Added to your sequence (${next.length} frame${next.length > 1 ? 's' : ''})`, label: 'View sequence' });
    if (actionToastTimer.current) clearTimeout(actionToastTimer.current);
    actionToastTimer.current = setTimeout(() => setActionToast(null), 6000);
  };

  const removeFromFusion = (index) => {
    const next = fusionPatterns.filter((_, i) => i !== index);
    setFusionPatterns(next);
    if (next.length === 0) {
      setFusedPattern(null);
      if (playKind === 'fused') stopPlayback();
    } else {
      setFusedPattern(buildFused(next));
    }
  };

  const hasLayers = layers.some((l) => l.pattern);

  const playLayers = () => {
    if (!hasLayers) return;
    if (playKind === 'layers') {
      stopPlayback();
      return;
    }
    setSelectedPattern(null);
    setPlayKind('layers');
    startPlayback('layers', null);
  };

  const clearLayer = (index) => {
    setLayers((prev) => prev.map((l, i) => (i === index ? { ...l, pattern: null } : l)));
    setActiveLayer(index);
  };

  const clearAllLayers = () => {
    if (playKind === 'layers') stopPlayback();
    setLayers((prev) => prev.map((l) => ({ ...l, pattern: null })));
    setActiveLayer(0);
  };

  const setLayerInstrument = (index, instrument) => {
    setLayers((prev) => prev.map((l, i) => (i === index ? { ...l, instrument } : l)));
  };

  // All sequencer frames share the size of the longest pattern in the sequence
  const seqMaxSteps = sequence.reduce((m, p) => Math.max(m, p.code.split(' ').length), 1);
  const FRAME_SPEC = {
    sm: { step: 16, min: 84, text: 'text-xs', num: 10 },
    md: { step: 24, min: 112, text: 'text-sm', num: 12 },
    lg: { step: 34, min: 156, text: 'text-base', num: 14 }
  };
  const frameSpec = FRAME_SPEC[barPrefs.frame] || FRAME_SPEC.sm;
  const seqTileWidth = Math.max(frameSpec.min, seqMaxSteps * frameSpec.step + 28);

  // Build the score handed to the MuseScore / MIDI exporters (4 bars for looping modes, like the playback)
  const makeScore = (kind) => {
    const bpb = Math.max(1, beatsPerBar);
    const common = { tempo, beatsPerBar: bpb, unit: noteUnit, ghost: notationGhost };
    const loop = (pat) => Array.from({ length: bpb * 4 }, () => pat);
    if (kind === 'sequence') {
      if (!sequence.length) return null;
      const beats = [...sequence];
      while (beats.length % bpb) beats.push(null);
      return { ...common, fileName: 'abel-sequence', title: 'ABEL Rhythm Alphabet – Sequence',
        parts: [{ instrument: selectedInstrument, beats }] };
    }
    if (kind === 'fused') {
      if (!fusedPattern) return null;
      return { ...common, fileName: 'abel-fused-' + fusedPattern.letter.replace(/[^A-Za-z0-9]/g, ''),
        title: 'ABEL Rhythm Alphabet – ' + fusedPattern.letter,
        parts: [{ instrument: selectedInstrument, beats: loop(fusedPattern) }] };
    }
    const active = layers.filter((l) => l.pattern);
    if (!active.length) return null;
    return { ...common, fileName: 'abel-layers', title: 'ABEL Rhythm Alphabet – Layers',
      parts: active.map((l) => ({ instrument: l.instrument, beats: loop(l.pattern) })) };
  };

  const infoPattern = playKind === 'solo' ? selectedPattern : playKind === 'fused' ? fusedPattern : null;

  /* ---------------- Render ---------------- */
  return (
    <div className={`min-h-screen p-3 sm:p-6 ${lightTheme ? 'abel-light bg-gray-100 text-gray-900' : 'bg-gray-900 text-white'}`}>

      {(mergeFirst || (playKind === 'solo' && selectedPattern && selectedPattern.parts)) && (

            left: 12,

            gap: 8,
            pointerEvents: 'none'

        >

            <div

                  <PatternView

                    size="md"
                  />
                </div>
                <button

            </div>

      {showTransport && !fs && (
        <div
          className="bg-gray-800 border-b border-gray-700 shadow-lg"

                    <li>• <strong>A</strong> (Pulse) → <strong>B</strong> (2 Halves) → <strong>E</strong> (3 Thirds) → <strong>L</strong> (4 Quarters)</li>

                    <li>• <strong>Sequence Mode:</strong> Click patterns to build a sequence. Press and hold a frame to reorder.</li>
                    <li>• <strong>Fusion Mode:</strong> Combine patterns for complex subdivisions (e.g., E+E+E = nonuplet).</li>
                    <li>• <strong>Layer Mode:</strong> Play up to 4 simultaneous patterns, each with its own instrument.</li>
                  </ul>

          {/* Mode & view */}

            <div className="border-t border-gray-700 pt-3">

                    className={`h-11 rounded-lg font-bold transition-colors ${

                    }`}

              </div>
              <div className="mt-2 space-y-2">
                {notationMode && (
                <div className="ml-6 space-y-2">

                      <button

                  </div>

                {pieMode && (

                <button
